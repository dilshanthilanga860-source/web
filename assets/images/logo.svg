<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4d0" />
      <stop offset="25%" stop-color="#d4af37" />
      <stop offset="60%" stop-color="#aa771c" />
      <stop offset="100%" stop-color="#553a06" />
    </linearGradient>
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#7a0d0d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Crest Emblem -->
  <g transform="translate(10, 5)">
    <!-- Wings left -->
    <path d="M 35 15 C 20 20 8 35 5 52 C 14 50 24 44 32 38 C 22 45 16 54 18 64 C 26 58 35 50 40 40 Z" fill="url(#goldGrad)" opacity="0.9"/>
    <!-- Wings right -->
    <path d="M 45 15 C 60 20 72 35 75 52 C 66 50 56 44 48 38 C 58 45 64 54 62 64 C 54 58 45 50 40 40 Z" fill="url(#goldGrad)" opacity="0.9"/>
    
    <!-- Central Sword / Dagger -->
    <path d="M 40 2 L 44 20 L 40 68 L 36 20 Z" fill="url(#goldGrad)"/>
    <path d="M 40 5 L 41.5 20 L 40 65 L 38.5 20 Z" fill="#ffffff" opacity="0.7"/>
    
    <!-- Crossguard -->
    <path d="M 28 22 L 52 22 L 48 26 L 32 26 Z" fill="url(#goldGrad)"/>
    
    <!-- Red Ruby Core -->
    <polygon points="40,24 45,31 40,38 35,31" fill="url(#rubyGrad)" filter="url(#glow)"/>
    <polygon points="40,27 43,31 40,35 37,31" fill="#ff9999"/>
    
    <!-- Golden Shield Ring -->
    <circle cx="40" cy="35" r="28" stroke="url(#goldGrad)" stroke-width="2.5" fill="none" opacity="0.6"/>
    <circle cx="40" cy="35" r="32" stroke="url(#goldGrad)" stroke-width="1" stroke-dasharray="2,3" fill="none" opacity="0.4"/>
  </g>

  <!-- Game Title Typography -->
  <text x="95" y="42" font-family="'Cinzel', 'Trajan Pro', 'Georgia', serif" font-size="34" font-weight="900" letter-spacing="6" fill="url(#goldGrad)" filter="url(#glow)">
    AETHERIA
  </text>
  <text x="98" y="62" font-family="'Montserrat', sans-serif" font-size="11" font-weight="700" letter-spacing="7.5" fill="#e9dfc7" opacity="0.85">
    REALM OF VALOR
  </text>
</svg>
